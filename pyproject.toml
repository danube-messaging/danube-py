[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danube-client"
version = "0.1.0"
description = "Python async client for the Danube messaging platform"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[tool.setuptools.packages.find]
include = ["danube*"]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
